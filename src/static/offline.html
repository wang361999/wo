<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4efe1">
<title>离线卷 · 一页工具</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#f4efe1;--surface:#fdf8ec;--ink:#221e12;--ink-2:#5c5442;--line:#d8cfb8;--red:#b03528;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",SimSun,serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--serif);display:flex;align-items:center;justify-content:center;padding:28px 20px}
  .page{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--ink);box-shadow:7px 7px 0 rgba(34,30,18,.13)}
  .top{border-bottom:3px double var(--ink);padding:12px 22px;display:flex;align-items:center;gap:10px;font:12px var(--mono);letter-spacing:.14em;color:var(--ink-2)}
  .seal{width:17px;height:17px;background:var(--red);display:inline-block;flex:none}
  .body{padding:40px 34px 34px}
  .kicker{font:12px var(--mono);letter-spacing:.2em;color:var(--red);margin:0 0 14px}
  h1{font-size:40px;line-height:1.3;margin:0 0 18px;font-weight:700;letter-spacing:.04em}
  h1 em{font-style:normal;color:var(--red)}
  p{font-size:15px;line-height:1.95;color:var(--ink-2);margin:0 0 14px}
  .rule{border:0;border-top:1px solid var(--line);margin:26px 0}
  ul{padding-left:1.2em;margin:0 0 22px;font-size:14px;line-height:2;color:var(--ink-2)}
  b{color:var(--ink)}
  .acts{display:flex;gap:12px;flex-wrap:wrap}
  a,button{font:14px var(--serif);padding:11px 22px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
  a.primary,button.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:3px 3px 0 rgba(34,30,18,.35)}
  a:active,button:active{transform:translate(3px,3px);box-shadow:none}
  .foot{border-top:3px double var(--ink);padding:11px 22px;font:11px var(--mono);color:var(--ink-2);letter-spacing:.08em}
  @media(max-width:520px){.body{padding:30px 22px 26px}h1{font-size:31px}.acts a,.acts button{flex:1;text-align:center}}
</style></head>
<body>
<div class="page">
  <div class="top"><span class="seal" aria-hidden="true"></span>一頁工具 · 離線卷 / OFFLINE</div>
  <div class="body">
    <p class="kicker">卷外 · 暫斷網絡</p>
    <h1>这一页<em>暂时翻不开</em></h1>
    <p>现在没有连上网络，本站也还没把这一页收进离线缓存。已经打开过的工具页仍然可以照常用，装到桌面后也一样。</p>
    <hr class="rule">
    <ul>
      <li><b>纯本地工具</b>：图片、PDF、文本、编码、计算这类，缓存后完全离线可用，文件照旧不上传。</li>
      <li><b>在线数据工具</b>：汇率、IP、域名解析、实时统计这些要联网才有结果。</li>
      <li>回到总目后随便点开几个常用工具，本站会顺手把它们记住，下次断网也能用。</li>
    </ul>
    <div class="acts">
      <button type="button" class="primary" onclick="location.reload()">重试一次</button>
      <a href="/">回到总目</a>
    </div>
  </div>
  <div class="foot">一頁工具 · 打開就能用 · 文件不上傳</div>
</div>
</body></html>
